<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14233A" />
    <title>别吵醒奶龙</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <div class="game-shell">
        <canvas id="game" width="390" height="700" aria-label="游戏画面"></canvas>

        <div class="hud" id="hud" hidden>
          <div class="hud-score">
            <span id="score">0</span>
            <small>BEST <b id="best">0</b></small>
          </div>
          <button type="button" class="icon-btn" id="muteBtn" aria-label="静音">♪</button>
        </div>

        <button
          type="button"
          class="act-zone"
          id="actZone"
          hidden
          aria-label="按住偷吃"
        >
          <span id="actHint">按住偷吃</span>
        </button>

        <div class="overlay" id="bootOverlay">
          <h1>别吵醒奶龙</h1>
          <img class="boot-art" src="/assets/nailong.jpeg" alt="奶龙" />
          <p class="boot-tip">趁他睡着，偷偷打开冰箱</p>
          <button type="button" class="primary" id="startBtn">开始</button>
        </div>

        <div class="overlay catch-overlay" id="catchOverlay" hidden>
          <img id="catchArt" src="/assets/nailong.jpeg" alt="被抓了" />
        </div>

        <div class="overlay" id="resultOverlay" hidden>
          <p class="result-label">本局</p>
          <p class="result-score" id="resultScore">0</p>
          <p class="result-best">最高 <span id="resultBest">0</span></p>
          <button type="button" class="primary" id="retryBtn">再来一次</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
