<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>v0.2 原型 · 手感与分享</title>
  <link rel="stylesheet" href="./prototype.css" />
  <style>
    .v02-rail { display: grid; grid-template-columns: repeat(2, minmax(180px, 280px)); gap: 1rem; justify-content: start; }
  </style>
</head>
<body>
  <header class="board-header">
    <div>
      <p class="board-kicker">产品原型 v0.2</p>
      <h1>手感增强与分享</h1>
      <p class="board-desc">惊险躲过浮字 · 连躲 HUD · 结算分享卡</p>
    </div>
  </header>
  <section class="panel">
    <div class="panel-head"><h2>设计图</h2></div>
    <div class="v02-rail phone-rail">
      <figure class="phone">
        <img src="./screens-v02/01-nearmiss.jpg" alt="好险浮字与连躲" />
        <figcaption><span>01</span>Near Miss</figcaption>
      </figure>
      <figure class="phone">
        <img src="./screens-v02/02-share.jpg" alt="结算与分享成绩" />
        <figcaption><span>02</span>结算分享</figcaption>
      </figure>
    </div>
    <p style="margin-top:1rem"><a href="./index.html">← 返回 v1 五屏看板</a></p>
  </section>
</body>
</html>
